name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-hw2.txt
      - run: python -m pip install -r requirements-hw2.txt
      - name: Product tests and every personal tool golden case
        run: python -m pytest -q -p no:cacheprovider tests --junitxml=tmp/hw2-junit.xml
      - name: Preserve Archil HW1 regression coverage
        run: python -m pytest -q -p no:cacheprovider hw1/Archi-lee-Sun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw2-test-evidence
          path: tmp/hw2-junit.xml
